<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Project Atlas</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>

<header class="bar">
  <div class="bar-title">
    <strong>Project Atlas</strong>
    <span class="muted" id="scan-stamp">loading…</span>
  </div>

  <div class="controls" role="group" aria-label="Filters and encoding">
    <label class="ctl">
      <span>Search</span>
      <input type="search" id="f-search" placeholder="name, org, language…" autocomplete="off">
    </label>

    <label class="ctl">
      <span>Group by</span>
      <select id="f-group">
        <option value="owner">Organization</option>
        <option value="provenance">Provenance</option>
        <option value="status">Status</option>
        <option value="presence">Local vs remote</option>
        <option value="language">Language</option>
        <option value="visibility">Hidden / ignored</option>
        <option value="duplicates">Duplicate clusters</option>
        <option value="none">Nothing (one big map)</option>
      </select>
    </label>

    <label class="ctl">
      <span>Color by</span>
      <select id="f-color">
        <option value="recency">Recency of work</option>
        <option value="prov-recency">Mine vs outside × recency</option>
        <option value="issues">Open issues</option>
        <option value="status">Status (your call)</option>
        <option value="provenance">Provenance</option>
        <option value="priority">Priority</option>
      </select>
    </label>

    <div class="ctl" id="ctl-hue">
      <span>Palette — low <span class="arrow">→</span> high</span>
      <div class="hue-pair">
        <select id="f-hue" aria-label="Palette start colour"></select>
        <select id="f-hue-to" aria-label="Palette end colour"></select>
        <select id="f-preset" aria-label="Palette preset">
          <option value="">Presets…</option>
          <option value="red:green">Red → Green</option>
          <option value="red:blue">Red → Blue</option>
          <option value="red:aqua">Red → Aqua</option>
          <option value="yellow:violet">Amber → Violet</option>
          <option value="orange:blue">Orange → Blue</option>
          <option value="blue:blue">Blue (single hue)</option>
          <option value="grey:grey">Grey (single hue)</option>
        </select>
        <span id="palette-badge" class="palette-badge" tabindex="0"></span>
      </div>
    </div>

    <label class="ctl" id="ctl-scale">
      <span>Scale</span>
      <select id="f-scale">
        <option value="auto">Auto — spread this set</option>
        <option value="fixed">Fixed — absolute age</option>
      </select>
    </label>

    <label class="ctl">
      <span>Area</span>
      <select id="f-size">
        <option value="sqrt-work">&#8730; work by you (commits + lines)</option>
        <option value="sqrt-effort">&#8730; commits by you</option>
        <option value="sqrt-commits">&#8730; all commits</option>
        <option value="commits">all commits (linear)</option>
        <option value="sqrt-issues">&#8730; open issues</option>
        <option value="issues">open issues (linear)</option>
        <option value="sqrt-files">&#8730; tracked files</option>
        <option value="equal">equal</option>
      </select>
    </label>

    <label class="ctl">
      <span>Worked on</span>
      <select id="f-date">
        <option value="any">Any time</option>
        <option value="week">Past week</option>
        <option value="month">Past 30 days</option>
        <option value="quarter">Past 90 days</option>
        <option value="year">Past year</option>
        <option value="quiet-year">Quiet 1 year +</option>
        <option value="quiet-2y">Quiet 2 years +</option>
      </select>
    </label>

    <label class="ctl">
      <span>Showing</span>
      <select id="f-visibility">
        <option value="visible">Visible only</option>
        <option value="all">Everything</option>
        <option value="parked">Only hidden + ignored</option>
        <option value="hidden">Only hidden</option>
        <option value="ignored">Only ignored</option>
      </select>
    </label>

    <div class="ctl-buttons">
      <button type="button" id="btn-triage" aria-pressed="false"
              title="Judge the untriaged set one card at a time, coldest first">Triage</button>
      <button type="button" id="btn-table" aria-pressed="false">Table</button>
      <button type="button" id="btn-share" aria-pressed="false"
              title="Share mode: keep the shape, hide the identities — private names, orgs, paths, descriptions and notes are masked. Numbers stay.">Share</button>
      <button type="button" id="btn-theme" title="Toggle light / dark">◑</button>
      <button type="button" id="btn-export" title="Download verdicts.json">Export</button>
    </div>
  </div>
</header>

<div class="legend">
  <span id="legend-body" aria-live="polite"></span>
  <span class="focus-chip" id="focus-chip" hidden></span>
  <span class="undrawn" id="undrawn" hidden></span>
</div>

<div class="workspace">
<main id="stage" tabindex="0" aria-label="Project treemap">
  <div id="treemap"></div>
  <div id="dock" hidden aria-label="Minimized groups"></div>
</main>

<section id="table-view" hidden aria-label="Project table">
  <table>
    <thead>
      <tr>
        <th scope="col">Project</th><th scope="col">Org</th><th scope="col">Provenance</th>
        <th scope="col">Where</th><th scope="col" class="num">Commits</th>
        <th scope="col">Last work</th><th scope="col" class="num">Issues</th>
        <th scope="col" class="num">PRs</th><th scope="col">Status</th>
        <th scope="col">Priority</th><th scope="col">Showing</th><th scope="col">Tags</th>
      </tr>
    </thead>
    <tbody id="table-body"></tbody>
  </table>
</section>

<aside id="panel" hidden aria-label="Project detail">
  <div class="panel-tools">
    <button type="button" id="panel-pin" aria-pressed="false"
            title="Pin the panel open">📌 Pin</button>
    <button type="button" class="panel-close" id="panel-close" aria-label="Close">×</button>
  </div>
  <div id="panel-body"></div>
</aside>
</div>

<div id="triage" hidden aria-label="Triage mode"></div>

<div id="tooltip" role="tooltip" hidden></div>

<button type="button" id="chrome-exit" hidden title="Show the toolbar again">⚙ controls</button>

<footer class="hint">
  <kbd>1</kbd><kbd>2</kbd><kbd>3</kbd> priority · <kbd>0</kbd> none ·
  <kbd>a</kbd> active · <kbd>u</kbd> in use · <kbd>s</kbd> someday ·
  <kbd>d</kbd> done · <kbd>x</kbd> dead ·
  <kbd>h</kbd> hide · <kbd>i</kbd> ignore · <kbd>p</kbd> pin panel · <kbd>esc</kbd> close
  <span class="save-state" id="save-state"></span>
</footer>

<script src="/palette.js"></script>
<script src="/app.js"></script>
</body>
</html>
