name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  web:
    name: Server + page
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Syntax-check every JS file
        run: |
          set -e
          for f in server.js scan.js tools-genramps.mjs public/*.js scripts/*.js mcp/*.js; do
            echo "check $f"
            node --check "$f"
          done
      - name: Server smoke test
        run: node scripts/smoke.js
      - name: MCP adapter smoke test
        run: node scripts/mcp-smoke.js

  menubar:
    name: Menu bar app
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Type-check AtlasMenu.swift
        run: swiftc -typecheck menubar/AtlasMenu.swift
